services:
  - type: web
    name: moveinsync-pulse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: USE_MOCK_AI
        value: "true"
      - key: APP_ID
        value: com.moveinsync.ets
      - key: DAYS_HISTORY
        value: "180"
